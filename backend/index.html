
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Tax Calculator</title>
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/tax-rate-calculator-assets/logo.png?v=1">
    <link rel="shortcut icon" href="https://storage.googleapis.com/tax-rate-calculator-assets/logo.png?v=1">
    <link rel="apple-touch-icon" href="https://storage.googleapis.com/tax-rate-calculator-assets/logo.png?v=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #0ea5e9;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0284c7;
      }
      @keyframes booty-shake {
        0% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(-15deg) scale(1.1) translateY(-5px); }
        50% { transform: rotate(15deg) scale(1.1) translateY(-5px); }
        75% { transform: rotate(-15deg) scale(1.1) translateY(-5px); }
        100% { transform: rotate(0deg) scale(1); }
      }
      @keyframes splash {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      .logo-animate:hover {
        animation: booty-shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      .logo-animate {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-animate:active::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -20px;
        margin-left: -20px;
        width: 40px;
        height: 40px;
        background: rgba(14, 165, 233, 0.6);
        border-radius: 50%;
        animation: splash 0.6s ease-out;
        pointer-events: none;
        z-index: 10;
      }
      .pop-out-3d {
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .pop-out-3d:hover {
        transform: scale(1.4) translateY(-10px);
        filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.15));
      }
    </style>
  </head>
  <body class="bg-sky-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
